<script>
  /* 有些靜態伺服器會把 /diet/ 重導成 /diet（去掉尾斜線），
     相對路徑就會解析到上一層，app.js 和 manifest 會 404。補回斜線再載入。 */
  (function () {
    var p = location.pathname;
    if (p && p.slice(-1) !== '/' && !/\.[a-z0-9]+$/i.test(p)) {
      location.replace(p + '/' + location.search + location.hash);
    }
  })();
</script>
